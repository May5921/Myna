name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci || npm install
        env:
          # CI 不需要 Electron 二进制，跳过下载可省约 100MB / 数十秒
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - name: Test
        run: npm test
      - name: Syntax check
        run: npm run check
