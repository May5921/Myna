name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # electron 的 postinstall 会下载 100MB+ 二进制，单测和语法检查都用不到
      - run: npm ci --ignore-scripts

      - name: 单元测试
        run: npm test

      - name: 语法与契约检查
        run: npm run check

  # 端到端测试要真开 Electron 窗口，本地跑（npm run e2e），CI 里不稳定，故不纳入。
