name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # 产品只在 Windows 发布；在 ubuntu 之外再跑一遍 Windows 纯逻辑测试，
    # 至少能在 CI 里覆盖路径分隔符、大小写与 Windows 专属分支。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # electron 的 postinstall 会下载 100MB+ 二进制，单测和语法检查都用不到
      - run: npm ci --ignore-scripts

      - name: 单元测试
        run: npm test

      - name: 语法与契约检查
        run: npm run check

  # 端到端测试要真开 Electron 窗口（17 场景；断言数随本地历史数据变化），本地跑 npm run e2e；
  # CI 跑 GUI 不稳定，故不纳入。打包产物与安装包仍需本地验证。
