<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:"
		/>
		<title>pi</title>
		<link rel="stylesheet" href="./styles/base.css" />

	</head>
	<body>
		<div id="app">
			<aside id="side">
				<div class="side-head">
					<span class="name">pi</span>
					<span class="grow"></span>
				</div>
				<div id="list"></div>
			</aside>
			<main>
				<div id="topbar">
					<button id="toggle" title="收起/展开侧栏" class="on">
						<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
							<rect x="2.2" y="3" width="11.6" height="10" rx="1.6" />
							<path d="M6.4 3v10" />
						</svg>
					</button>
					<button id="cwd" title="切换工作区">
						<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
							<path d="M2 4.6c0-.6.5-1 1-1h3l1.4 1.6H13c.6 0 1 .5 1 1v5.8c0 .6-.4 1-1 1H3c-.5 0-1-.4-1-1V4.6Z" stroke-linejoin="round" />
						</svg>
						<span id="cwd-name"></span>
					</button>
					<div class="spacer"></div>
				</div>
				<div id="stream"></div>
				<button id="jump" hidden>回到底部</button>
				<footer id="composer">
					<div class="box">
						<textarea id="input" rows="1" placeholder="使用 pi"></textarea>
						<div class="cbar">
							<div class="spacer"></div>
							<button id="model" title="切换模型"></button>
							<button id="send" title="发送">
								<svg class="up" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">
									<path d="M8 12.6V3.6M4.2 7.2 8 3.4l3.8 3.8" stroke-linecap="round" stroke-linejoin="round" />
								</svg>
								<svg class="sq" width="10" height="10" viewBox="0 0 10 10">
									<rect x="1" y="1" width="8" height="8" rx="1.6" fill="currentColor" />
								</svg>
							</button>
						</div>
					</div>
				</footer>
			</main>
		</div>
		<div id="menu" hidden></div>
		<script type="module" src="./src/app.js"></script>
	</body>
</html>
